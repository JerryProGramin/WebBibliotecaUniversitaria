<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - Biblioteca XYZ</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS propio -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="login-card text-center">
      <img src="images/logo.png" alt="Logo Biblioteca XYZ" class="mb-3" style="width:80px;">

      <h2 class="fw-bold mb-2">Recuperar Contraseña</h2>
      <p class="text-muted mb-4">
        Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
      </p>

      <form id="recoverForm" class="text-start">
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" id="email" class="form-control" placeholder="Ingresa tu correo" required>
        </div>

        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-primary">Enviar enlace</button>
        </div>
      </form>

      <div class="text-center mt-3">
        <a href="login.html" class="text-decoration-none">&larr; Volver al inicio de sesión</a>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Simulación de envío -->
  <script>
    document.getElementById('recoverForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;

      if (email) {
        alert("Se ha enviado un enlace de recuperación a " + email);
        // Simula que el usuario hace clic en el enlace recibido por correo
        window.location.href = "nuevacontra.html";
        } else {
        alert("Por favor, ingresa un correo válido.");
        }
    });
  </script>
</body>
</html>
