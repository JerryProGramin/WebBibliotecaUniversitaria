{% extends 'web/base.html' %}
{% load static %}

{% block title %}Categorías - Biblioteca{% endblock %}
{% block header_title %}Categorías{% endblock %}

{% block content %}
<div class="students-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
    <h2 style="margin:0;color:#7b1138;">Listado de categorías</h2>
    <button class="btn-main" id="btn-add-category">Nueva categoría</button>
</div>

<table>
    <thead>
        <tr>
            <th>Nombre</th>
            <th style="width:150px;">Acciones</th>
        </tr>
    </thead>
    <tbody id="categories-tbody">
        <!-- JS llena aquí -->
    </tbody>
</table>

<p class="error-msg" id="cat-global-error" style="display:none;"></p>

<!-- MODAL -->
<div class="modal-backdrop" id="category-modal">
    <div class="modal-card">
        <h2 id="cat-modal-title">Nueva categoría</h2>
        <form id="category-form">
            {% csrf_token %}
            <input type="hidden" id="category-id">

            <label>Nombre</label>
            <input type="text" id="inp-cat-nombre" required>

            <p class="error-msg" id="cat-form-error" style="display:none;"></p>

            <div class="modal-actions">
                <button type="button" class="btn-secondary" id="btn-cat-cancel">Cancelar</button>
                <button type="submit" class="btn-main" id="btn-cat-save">Guardar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'web/js/categories.js' %}"></script>
{% endblock %}
